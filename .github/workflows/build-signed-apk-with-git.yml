name: Build signed APK (with bundled git)

# A second signed-APK workflow that ALSO cross-compiles the bundled git binary,
# so the resulting APK is fully working (uploads included). Runs on push to main
# and on demand; produces the "gitofy-signed-full" artifact.
#
# Uses the same permanent signing secrets created by "Bootstrap signing secrets".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName to stamp (e.g. 1.3.0). Blank = use build.gradle."
        required: false
        default: ""
      build_git:
        description: "Cross-compile the bundled git binary (recommended)"
        type: boolean
        default: true
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Repair base64-encoded source files (transfer safety net)
        run: |
          python3 - <<'PYEOF'
          import base64, os, re
          targets = ["build.gradle.kts", "settings.gradle.kts", "gradle.properties",
                     "gradle/libs.versions.toml", "app/build.gradle.kts",
                     "app/src/main/AndroidManifest.xml"]
          for root, _, files in os.walk("app/src/main"):
              for fn in files:
                  if fn.endswith((".kt", ".xml")):
                      targets.append(os.path.join(root, fn))
          markers = ("package ", "plugins {", "android {", "[versions]",
                     "<manifest", "<?xml", "rootProject.name", "<resources")
          b64 = re.compile(r"[A-Za-z0-9+/=\s]+")
          fixed = 0
          for p in targets:
              if not os.path.exists(p):
                  continue
              s = open(p, "rb").read().decode("utf-8", "ignore").strip()
              if len(s) < 40 or not b64.fullmatch(s):
                  continue
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", s), validate=True).decode("utf-8")
              except Exception:
                  continue
              if any(m in dec for m in markers):
                  open(p, "w").write(dec)
                  fixed += 1
                  print("repaired:", p)
          print("base64-encoded files repaired:", fixed)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -e
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ROOT" ]; then echo "::error::No Android SDK on this runner"; exit 1; fi
          echo "sdk.dir=$ROOT" > local.properties
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          CT="$(ls -d "$ROOT"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -n "$CT" ]; then
            echo "$CT" >> "$GITHUB_PATH"
            SM="$CT/sdkmanager"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "Android SDK ready at $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install NDK
        if: ${{ github.event.inputs.build_git != 'false' }}
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Build bundled git binary
        id: gitbuild
        if: ${{ github.event.inputs.build_git != 'false' }}
        continue-on-error: true
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          bash tools/build-git-android.sh arm64-v8a
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Warn if the git binary did not build
        if: ${{ steps.gitbuild.outcome == 'failure' }}
        run: echo "::warning::The bundled git binary did not build; the APK is signed but uploads will be disabled."

      - name: Validate signing secrets
        run: |
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing secret $s — run the Bootstrap signing workflow first."; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/gitofy.keystore"

      - name: Write signing.properties
        run: |
          cat > "$RUNNER_TEMP/signing.properties" <<TXT
          storeFile=$RUNNER_TEMP/gitofy.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          TXT
          echo "SIGNING_PROPERTIES_FILE=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Stamp version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${{ github.event.inputs.version }}\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          grep -nE "versionName|versionCode" app/build.gradle.kts

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$BT/apksigner" verify --verbose "$apk"
          done

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-signed-full
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
