name: Build signed APK (with bundled git)

# A second signed-APK workflow that ALSO cross-compiles the bundled git binary,
# so the resulting APK is fully working (uploads included). Runs on push to main
# and on demand; produces the "gitofy-signed-full" artifact.
#
# Uses the same permanent signing secrets created by "Bootstrap signing secrets".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName to stamp (e.g. 1.3.0). Blank = use build.gradle."
        required: false
        default: ""
      build_git:
        description: "Cross-compile the bundled git binary (recommended)"
        type: boolean
        default: true
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install NDK
        if: ${{ github.event.inputs.build_git != 'false' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125"

      - name: Build bundled git binary
        id: gitbuild
        if: ${{ github.event.inputs.build_git != 'false' }}
        continue-on-error: true
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          bash tools/build-git-android.sh arm64-v8a
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Warn if the git binary did not build
        if: ${{ steps.gitbuild.outcome == 'failure' }}
        run: echo "::warning::The bundled git binary did not build; the APK is signed but uploads will be disabled."

      - name: Validate signing secrets
        run: |
          missing=0
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing secret $s — run the Bootstrap signing workflow first."; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/gitofy.keystore"

      - name: Write signing.properties
        run: |
          cat > "$RUNNER_TEMP/signing.properties" <<TXT
          storeFile=$RUNNER_TEMP/gitofy.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          TXT
          echo "SIGNING_PROPERTIES_FILE=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Stamp version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${{ github.event.inputs.version }}\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          grep -nE "versionName|versionCode" app/build.gradle.kts

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$BT/apksigner" verify --verbose "$apk"
          done

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-signed-full
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
