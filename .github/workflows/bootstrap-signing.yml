name: Bootstrap signing secrets (one-time, permanent)

# Generates the Android release keystore ONCE inside Actions and writes the four
# repository secrets, so every future release is signed with the same permanent
# identity. Refuses to overwrite an existing identity unless you set force=true
# (overwriting breaks updates for apps already installed).
#
# Why a PAT: GitHub does not let the built-in GITHUB_TOKEN write repository
# secrets. Add a repository secret named GH_SECRETS_PAT (a fine-grained token with
# "Secrets: Read and write", or a classic token with the "repo" scope). Without it
# the keystore is still generated and offered as an artifact for manual setup.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate and OVERWRITE the existing signing keystore (breaks updates for installed apps)"
        type: boolean
        default: false
      export_credentials:
        description: "Also put the passwords in the backup artifact (keep it private!)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair base64-encoded source files (transfer safety net)
        run: |
          python3 - <<'PYEOF'
          import base64, os, re
          targets = ["build.gradle.kts", "settings.gradle.kts", "gradle.properties",
                     "gradle/libs.versions.toml", "app/build.gradle.kts",
                     "app/src/main/AndroidManifest.xml"]
          for root, _, files in os.walk("app/src/main"):
              for fn in files:
                  if fn.endswith((".kt", ".xml")):
                      targets.append(os.path.join(root, fn))
          markers = ("package ", "plugins {", "android {", "[versions]",
                     "<manifest", "<?xml", "rootProject.name", "<resources")
          b64 = re.compile(r"[A-Za-z0-9+/=\s]+")
          fixed = 0
          for p in targets:
              if not os.path.exists(p):
                  continue
              s = open(p, "rb").read().decode("utf-8", "ignore").strip()
              if len(s) < 40 or not b64.fullmatch(s):
                  continue
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", s), validate=True).decode("utf-8")
              except Exception:
                  continue
              if any(m in dec for m in markers):
                  open(p, "w").write(dec)
                  fixed += 1
                  print("repaired:", p)
          print("base64-encoded files repaired:", fixed)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check whether an identity already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then echo "pat=true" >> "$GITHUB_OUTPUT"; else echo "pat=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$GH_TOKEN" ] && gh secret list -R "$GITHUB_REPOSITORY" 2>/dev/null | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite a permanent identity
        if: ${{ steps.check.outputs.exists == 'true' && github.event.inputs.force != 'true' }}
        run: |
          echo "::error::Signing secrets already exist. Set force=true only if you really want to replace the permanent identity (installed apps will stop updating)."
          exit 1

      - name: Generate the keystore
        id: gen
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/gitofy.keystore"
          ALIAS="gitofy"
          STOREPASS="$(openssl rand -base64 24)"
          KEYPASS="$STOREPASS"
          echo "::add-mask::$STOREPASS"
          keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=Gitofy, OU=Release, O=Gitofy, L=Unknown, ST=Unknown, C=IN"
          BASE64="$(base64 -w0 "$KS")"
          {
            echo "alias=$ALIAS"
            echo "storepass=$STOREPASS"
            echo "keypass=$KEYPASS"
            echo "base64=$BASE64"
          } >> "$GITHUB_OUTPUT"
          echo "KS=$KS" >> "$GITHUB_ENV"
          echo "Keystore generated (SHA-256 of cert follows):"
          keytool -list -v -keystore "$KS" -storepass "$STOREPASS" -alias "$ALIAS" | grep -i "SHA256:" || true

      - name: Create the four repository secrets
        if: ${{ steps.check.outputs.pat == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          printf '%s' '${{ steps.gen.outputs.base64 }}'    | gh secret set ANDROID_KEYSTORE_BASE64    -R "$GITHUB_REPOSITORY"
          printf '%s' '${{ steps.gen.outputs.storepass }}' | gh secret set ANDROID_KEYSTORE_PASSWORD -R "$GITHUB_REPOSITORY"
          printf '%s' '${{ steps.gen.outputs.alias }}'     | gh secret set ANDROID_KEY_ALIAS         -R "$GITHUB_REPOSITORY"
          printf '%s' '${{ steps.gen.outputs.keypass }}'   | gh secret set ANDROID_KEY_PASSWORD      -R "$GITHUB_REPOSITORY"
          echo "✅ Permanent signing secrets created: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"

      - name: Verify the secrets exist
        if: ${{ steps.check.outputs.pat == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          echo "Repository secrets now present (names only — values stay secret):"
          gh secret list -R "$GITHUB_REPOSITORY" | grep -E "ANDROID_(KEYSTORE_BASE64|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)" || true

      - name: Summary
        run: |
          {
            echo "## Gitofy signing"
            echo ""
            if [ "${{ steps.check.outputs.pat }}" = "true" ]; then
              echo "✅ The four permanent secrets were created in this repository:"
              echo '`ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS`, `ANDROID_KEY_PASSWORD`'
              echo ""
              echo "Now run **Build signed release APK** (or **Build signed APK (with bundled git)**)."
            else
              echo "⚠️ \`GH_SECRETS_PAT\` is not set, so secrets were NOT created automatically."
              echo "Add it (fine-grained token with *Secrets: Read and write*) and re-run, or add the four secrets by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Manual setup instructions (no PAT)
        if: ${{ steps.check.outputs.pat != 'true' }}
        run: |
          echo "::warning::GH_SECRETS_PAT is not set, so secrets were NOT created automatically."
          echo "Add these four repository secrets by hand from the backup artifact:"
          echo "  ANDROID_KEYSTORE_BASE64   <- base64 of gitofy.keystore"
          echo "  ANDROID_KEYSTORE_PASSWORD <- the store password"
          echo "  ANDROID_KEY_ALIAS         <- ${{ steps.gen.outputs.alias }}"
          echo "  ANDROID_KEY_PASSWORD      <- the key password"

      - name: Write the optional credentials file
        if: ${{ github.event.inputs.export_credentials == 'true' }}
        run: |
          cat > "$RUNNER_TEMP/signing-credentials.txt" <<TXT
          KEEP THIS FILE PRIVATE. It can sign apps as Gitofy.
          ANDROID_KEYSTORE_BASE64   = ${{ steps.gen.outputs.base64 }}
          ANDROID_KEYSTORE_PASSWORD = ${{ steps.gen.outputs.storepass }}
          ANDROID_KEY_ALIAS         = ${{ steps.gen.outputs.alias }}
          ANDROID_KEY_PASSWORD      = ${{ steps.gen.outputs.keypass }}
          TXT

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-keystore-backup
          path: |
            ${{ runner.temp }}/gitofy.keystore
            ${{ runner.temp }}/signing-credentials.txt
          if-no-files-found: warn
          retention-days: 90
