name: Build unsigned APK

# Builds an UNSIGNED release APK (and a debug APK you can install to test),
# entirely on GitHub — no Android Studio needed.
#
# The unsigned release APK is what you asked for. Note that Android will not
# install an unsigned APK directly; sign it with your own keystore (apksigner)
# before installing, or use the debug APK for testing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName to stamp (e.g. 1.0.1). Leave blank to use build.gradle."
        required: false
        default: ""
      build_git:
        description: "Also cross-compile the bundled git binary (slow, needs the NDK)"
        type: boolean
        default: false
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -e
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ROOT" ]; then echo "::error::No Android SDK on this runner"; exit 1; fi
          echo "sdk.dir=$ROOT" > local.properties
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          CT="$(ls -d "$ROOT"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -n "$CT" ]; then
            echo "$CT" >> "$GITHUB_PATH"
            SM="$CT/sdkmanager"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "Android SDK ready at $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stamp version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          V="${{ github.event.inputs.version }}"
          echo "Stamping versionName = $V"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$V\"/" app/build.gradle.kts
          grep -n versionName app/build.gradle.kts

      - name: Install NDK (only if building git)
        if: ${{ github.event.inputs.build_git == 'true' }}
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Build bundled git binary (optional)
        if: ${{ github.event.inputs.build_git == 'true' }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          bash tools/build-git-android.sh arm64-v8a
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Assemble unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK (installable for testing)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
